name: nightly

on:
  schedule:
    # 09:00 UTC: after DoD's ~5pm ET daily contract posting, quiet hours for
    # government hosts.
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Optional, for a manual backfill. Scheduled runs use the defaults.
    inputs:
      lookback_days:
        description: "USAspending lookback in days (default 180; ~760 covers two full years for year-over-year signals)"
        required: false
        default: ""
      classify_limit:
        description: "Max awards the classifier tags this run (default 1000)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Nightly runs take ~20 min; a manual backfill can take a couple of hours.
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # LLM steps: Claude by default. GEMINI_API_KEY is optional, needed only
      # when EXTRACT_MODEL / RESOLVE_MODEL name a Gemini model.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional opt-in for war.gov article pages (see README "Fetching policy").
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
      # Optional repository variables.
      FLOCK_CONTACT: ${{ vars.FLOCK_CONTACT }}
      EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      RESOLVE_MODEL: ${{ vars.RESOLVE_MODEL }}
      LLM_MIN_INTERVAL: ${{ vars.LLM_MIN_INTERVAL }}
      # Estimated dollars per UTC month; at the budget the LLM passes are
      # skipped (the steps still succeed) and the job summary says so.
      MONTHLY_LLM_BUDGET_USD: ${{ vars.MONTHLY_LLM_BUDGET_USD }}
      # Resolver: the SAM.gov key is optional (without it the agent works from
      # USAspending and our own data). SAM_DAILY_QUOTA must match the key type.
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      SAM_DAILY_QUOTA: ${{ vars.SAM_DAILY_QUOTA }}
      # Optional: agent traces go to Logfire only when this secret is set.
      LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
      FLOCK_STATS_FILE: ${{ github.workspace }}/stats.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        # observability = logfire; it stays idle unless LOGFIRE_TOKEN is set.
        run: uv sync --frozen --no-dev --group observability

      - name: Migrate
        run: uv run --no-sync python -m pipeline.db

      # The job summary reports LLM tokens and cost for runs started after this.
      - name: Mark run start
        run: echo "FLOCK_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: USAspending
        id: usaspending
        continue-on-error: true
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '180' }}
        run: uv run --no-sync python -m pipeline.sources.usaspending.run --lookback-days "$LOOKBACK_DAYS"

      # Non-blocking: war.gov returns 403 to non-browser clients unless the
      # Bright Data opt-in is configured. Exit code 2 = everything blocked.
      - name: DoD contract announcements
        id: dod_contracts
        continue-on-error: true
        run: uv run --no-sync python -m pipeline.sources.dod_contracts.run

      - name: Autonomy classifier
        id: classifier
        continue-on-error: true
        env:
          CLASSIFY_LIMIT: ${{ inputs.classify_limit || '1000' }}
        run: uv run --no-sync python -m pipeline.extract.classifier --limit "$CLASSIFY_LIMIT"

      # Non-blocking: it is new and depends on optional SAM.gov access. Only
      # high-confidence merges are applied; the rest wait in pending_merges
      # for `python -m pipeline.resolve review`.
      - name: Resolve organizations
        id: resolve
        continue-on-error: true
        env:
          RESOLVE_LIMIT: ${{ vars.RESOLVE_LIMIT || '25' }}
        run: uv run --no-sync python -m pipeline.resolve run --limit "$RESOLVE_LIMIT"

      # Recompute the dashboard's metrics (migrations/007_signals.sql) from
      # whatever the steps above loaded. Runs even when a step failed, so the
      # site's "as of" date and numbers still match the data that is there.
      - name: Refresh signals
        id: signals
        if: always()
        continue-on-error: true
        run: uv run --no-sync python -m pipeline.signals

      - name: Job summary
        if: always()
        env:
          OUTCOME_USASPENDING: ${{ steps.usaspending.outcome }}
          OUTCOME_DOD_CONTRACTS: ${{ steps.dod_contracts.outcome }}
          OUTCOME_CLASSIFIER: ${{ steps.classifier.outcome }}
          OUTCOME_RESOLVE: ${{ steps.resolve.outcome }}
          OUTCOME_SIGNALS: ${{ steps.signals.outcome }}
        run: uv run --no-sync python -m pipeline.report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          if-no-files-found: ignore
          retention-days: 90

      # USAspending, the classifier and the signals refresh are required; DoD
      # announcements and organization resolution are not.
      - name: Fail if a required step failed
        if: >-
          steps.usaspending.outcome == 'failure' || steps.classifier.outcome == 'failure'
          || steps.signals.outcome == 'failure'
        run: |
          echo "usaspending=${{ steps.usaspending.outcome }} classifier=${{ steps.classifier.outcome }} signals=${{ steps.signals.outcome }}"
          exit 1
